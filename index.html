<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f2" />
    <meta name="description" content="A quiet, focused workspace for deliberate exam practice." />
    <script>
      try {
        if (localStorage.getItem('stillroom.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#171b18')
        }
        const scale = Number(localStorage.getItem('stillroom.fontScale'))
        if (scale >= 0.9 && scale <= 1.2) document.documentElement.style.zoom = String(scale)
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Stillroom — focused exam practice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
